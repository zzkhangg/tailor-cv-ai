server:
  port: ${SERVER_PORT:8080}
spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tailorcv}
    username: ${DATABASE_USER:tailorcv}
    password: ${DATABASE_PASSWORD:tailorcv}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,aiService
  endpoints:
    web:
      exposure:
        include: health
ai:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${AI_READ_TIMEOUT_MS:5000}
