services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailorcv}
      POSTGRES_USER: ${POSTGRES_USER:-tailorcv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  ai-service:
    build: ./services/ai-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  resume-service:
    build: ./services/resume-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tailorcv}
      DATABASE_USER: ${POSTGRES_USER:-tailorcv}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      AI_SERVICE_URL: http://ai-service:8000
      AI_CONNECT_TIMEOUT_MS: ${AI_CONNECT_TIMEOUT_MS:-2000}
      AI_READ_TIMEOUT_MS: ${AI_READ_TIMEOUT_MS:-5000}
    ports:
      - "127.0.0.1:${JAVA_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      ai-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "com.tailorcv.resume.HealthProbe"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      resume-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
