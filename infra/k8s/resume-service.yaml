apiVersion: v1
kind: Service
metadata:
  name: resume-service
  labels:
    app.kubernetes.io/name: resume-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tailorcv
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: resume-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-service
  labels:
    app.kubernetes.io/name: resume-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tailorcv
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resume-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: tailorcv
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: resume-service
      containers:
        - name: resume-service
          image: tailorcv/resume-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/tailorcv
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: tailorcv-config
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tailorcv-secrets
                  key: POSTGRES_PASSWORD
            - name: AI_SERVICE_URL
              value: http://ai-service:8000
            - name: AI_CONNECT_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: tailorcv-config
                  key: AI_CONNECT_TIMEOUT_MS
            - name: AI_READ_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: tailorcv-config
                  key: AI_READ_TIMEOUT_MS
            - name: AI_PROCESSING_READ_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: tailorcv-config
                  key: AI_PROCESSING_READ_TIMEOUT_MS
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
